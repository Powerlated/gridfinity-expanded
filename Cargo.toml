[workspace]
resolver = "3"
default-members = ["crates/gridfinity-app"]
members = [
    "crates/gridfinity-app",
    "crates/gridfinity-brep",
    "crates/gridfinity-occt",
    "crates/gridfinity-model",
    "crates/gridfinity-project",
    "crates/gridfinity-render",
    "crates/gridfinity-sketch",
    "crates/gridfinity-web",
    "crates/gridfinity-xt",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = { version = "29", features = ["webgl"] }

[workspace.metadata.occt]
# Keep this synchronized with the vendor/occt gitlink.  OCCT is LGPL-2.1 with
# the OCCT exception; see THIRD_PARTY_LICENSES.md.
version = "8.0.1"

[patch.crates-io]
# 0.35 treats every wasm32 target as wasm-bindgen's browser backend. Emscripten
# uses wgpu-core-deps-emscripten instead, so its secure-context probe must not
# reference wgpu::web_sys. Remove when upstream releases equivalent gating.
egui-wgpu = { path = "third_party/egui-wgpu" }
eframe = { path = "third_party/eframe" }
winit = { path = "third_party/winit" }

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
