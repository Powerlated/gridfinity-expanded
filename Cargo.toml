[workspace]
resolver = "3"
members = [
    "crates/gridfinity-cad",
    "crates/gridfinity-gui",
    "crates/gridfinity-render",
    "crates/gridfinity-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wgpu = { version = "29", features = ["webgl"] }

[profile.release]
opt-level = 3
lto = "off"
codegen-units = 16

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
