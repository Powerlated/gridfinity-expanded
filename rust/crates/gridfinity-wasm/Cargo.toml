[package]
name = "gridfinity-wasm"
description = "WebAssembly bindings exposing the Gridfinity model to the web app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `cdylib` for the wasm artifact; `rlib` so the adapter logic stays unit-testable
# on the host target (the mesh transforms below have real tests).
crate-type = ["cdylib", "rlib"]

[dependencies]
gridfinity-cad = { path = "../gridfinity-cad", features = ["serde", "badapple"] }
gridfinity-render = { path = "../gridfinity-render" }
glam = "0.29"
glow = "0.17"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "WebGl2RenderingContext"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"
