[package]
name = "gridfinity-render"
description = "Shared wgpu renderer and camera for the egui debugger and the web viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu = { workspace = true }
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
naga = { version = "29", features = ["wgsl-in"] }
