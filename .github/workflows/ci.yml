name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust
        run: |
          rustup target add wasm32-unknown-emscripten
          cargo install wasm-bindgen-cli --version 0.2.126 --locked

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.5
          actions-cache-folder: emsdk-cache

      - name: Build OCCT for the host
        run: |
          cmake --preset occt-native
          cmake --build --preset occt-native-install

      - name: Build the workspace
        env:
          OCCT_ROOT: target/occt-install/native
        run: cargo build --release --workspace

      - name: Run the suite
        env:
          OCCT_ROOT: target/occt-install/native
        run: cargo test --release --workspace

      - name: Run the restored analytic kernel suite
        run: |
          cargo test --release -p gridfinity-brep --lib
          cargo test --release -p gridfinity-model --no-default-features

      - name: Run the OCCT-backed suites
        env:
          OCCT_ROOT: target/occt-install/native
        run: |
          cargo test --release -p gridfinity-occt --features occt
          cargo test --release -p gridfinity-xt --features occt

      - name: Build the browser page
        run: cargo run --release -p gridfinity-web
