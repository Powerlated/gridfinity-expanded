[package]
name = "gridfinity-cad"
description = "Minimalistic sketch-based parametric CAD kernel + Gridfinity model generator"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Derives Serialize/Deserialize on the model-layer parameter types, shaped to
# match the TypeScript reference's `BinConfig` JSON. Off by default so the
# native GUI build stays lean; the wasm crate turns it on.
serde = ["dep:serde"]

[dependencies]
glam = "0.29"
serde = { version = "1", features = ["derive"], optional = true }

# Benchmarks and `perf_report` must see the allocator the shipping binary uses,
# or they measure a bottleneck production does not have. Not a real dependency:
# the library never picks an allocator for its dependents, and wasm cannot build
# this one.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
mimalloc = "0.1"
rayon = "1"
# `tests/asserts.rs` reads the kernel's own source as an AST rather than as
# text, so "is this an assertion" is a question about the syntax tree and not
# about what a regex can see through a string literal or a comment.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
