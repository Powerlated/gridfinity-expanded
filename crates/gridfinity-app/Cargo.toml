[package]
name = "gridfinity-app"
description = "The Gridfinity desktop app: an egui construction debugger, and the headless `optimize` command that fits a drawer"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "gridfinity-app"
path = "src/main.rs"

[dependencies]
gridfinity-cad = { path = "../gridfinity-cad", features = ["badapple"] }
gridfinity-render = { path = "../gridfinity-render" }
eframe = { version = "0.35", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
egui = "0.35"
egui-wgpu = "0.35"
wgpu = { workspace = true }
glam = "0.29"
bytemuck = "1"
rfd = "0.15"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
mimalloc = "0.1"

[dev-dependencies]
rayon = "1"
