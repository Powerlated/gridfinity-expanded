[package]
name = "gridfinity-wasm"
description = "WebAssembly bindings exposing the Gridfinity model to the web app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `cdylib` for the wasm artifact; `rlib` so the adapter logic stays unit-testable
# on the host target (the mesh transforms below have real tests).
crate-type = ["cdylib", "rlib"]

[dependencies]
gridfinity-model = { path = "../gridfinity-model", features = ["serde"] }
gridfinity-project = { path = "../gridfinity-project", features = ["serde"] }
gridfinity-render = { path = "../gridfinity-render" }
glam = "0.29"
wgpu = { workspace = true }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"
