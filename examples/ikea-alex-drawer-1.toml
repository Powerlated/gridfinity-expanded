# A worked input for `cargo run -- optimize`.
#
#   cargo run -- optimize examples/ikea-alex-drawer-1.toml --mode walls --format stl -o out
#   cargo run -- optimize examples/ikea-alex-drawer-1.toml --mode walls -o drawer.x_t --view
#
# --mode is required: `walls` divides the whole drawer into one bin's compartments,
# `bins` gives every object a Gridfinity bin of its own. This drawer is a `walls`
# fit -- as discrete bins its objects want more cells than the drawer has, and the
# run says which one it ran out of room for rather than leaving it out.

# A measurement is millimetres unless it is a string naming its unit, as the
# level's is below: mm, cm, m, in and ft are the units.

[drawer]
width = 292.1          # the drawer's inside measurements, in mm
depth = 523.24

[settings]             # every key here is optional
grid_size = 40         # the cell pitch; 42 mm is the Gridfinity standard
divider_thickness = 1.2
clearance = 2
effort = "standard"    # quick | standard | thorough
height_units = 4       # 7 mm each, above a 7 mm base
wall_thickness = 1.2
fillet_radius = 2.5
magnets = false
screws = false
baseplate = true       # the grid the fitted bin drops into, cut on the bin's own lines
printer = "Elegoo Centauri Carbon"
tidy_absorb = "100mm"
# bed = { width = 250, depth = 210 }   # state a bed instead of a profile

[[objects]]
name = "level"
size = ["2.1 in", "9.2 in"]

[[objects]]
name = "caliper box"
size = ["25 cm", "9 cm"]

# `max_size` is the most this object's compartment may measure once the fit has
# finished tidying it, per axis, with an empty string for no limit. Settling
# grows a compartment into whatever leftover faces it, which would leave these
# batteries room to lie over at an angle; held to their own width they stay
# stood up. Stated in the object's own frame, so it follows the object round
# whichever quarter turn the packer gives it.
[[objects]]
name = "AAA batteries"
size =     ["4.5 cm", "124 mm"]
max_size = ["4.5 cm", ""]

[[objects]]
name = "tape measure"
size = ["80 mm", "85 mm"]

[[objects]]
name = "swiss army knife"
size = ["114 mm", "32 mm"]

[[objects]]
name = "steel file set"
size = ["380 mm", "100 mm"]

# [[objects]]
# name = "tape roll"
# size = ["152 mm", "110 mm"]

# [[objects]]
# name = "game boy color"
# size = ["80 mm", "135 mm"]

[[objects]]
name = "ethernet cable"
size = ["43 mm", "130 mm"]

