# A worked input for `cargo run -- optimize`.
#
#   cargo run -- optimize examples/ikea-alex-drawer-1.toml --mode walls --format stl -o out
#   cargo run -- optimize examples/ikea-alex-drawer-1.toml --mode walls -o drawer.x_t --view
#
# --mode is required: `walls` divides the whole drawer into one bin's compartments,
# `bins` gives every object a Gridfinity bin of its own. This drawer is a `walls`
# fit -- as discrete bins its objects want more cells than the drawer has, and the
# run says which one it ran out of room for rather than leaving it out.

# A measurement is millimetres unless it is a string naming its unit, as the
# level's is below: mm, cm, m, in and ft are the units.

[drawer]
width = 292.1          # the drawer's inside measurements, in mm
depth = 523.24

[settings]             # every key here is optional
grid_size = 40         # the cell pitch; 42 mm is the Gridfinity standard
divider_thickness = 1.2
clearance = 2
effort = "standard"    # quick | standard | thorough
height_units = 2       # 3.5 mm each, above a 7 mm base
wall_thickness = 1.2
# subbin_wall_thickness = 1.2  # the wall and floor of an insert; wall_thickness by default
# subbin_clearance = 0.25     # the gap between an insert and its compartment, per side.
#                             # Not `clearance`, which is the room an object is given.
fillet_radius = 2.5
magnets = false
screws = false
baseplate = true       # the grid the fitted bin drops into, cut on the bin's own lines
printer = "Elegoo Centauri Carbon"
tidy_absorb = "100mm"
# bed = { width = 250, depth = 210 }   # state a bed instead of a profile

[[objects]]
name = "level"
size = ["2.1 in", "9.2 in"]

[[objects]]
name = "caliper box"
size = ["25 cm", "9 cm"]

# `subbin` asks for an insert: a separately printed open-top box that drops into
# this object's compartment, stating its *interior* as [width, depth, height]
# with an empty string for an axis the fit decides. The interior is a strictly
# bounded box with no floor blend, so these batteries are held at 45 mm across
# and 30 mm deep however much settling grows the compartment, while the depth
# takes whatever it is given. Its four vertical corners are rounded within that
# box, by the outer corner less the wall, so the walls are one thickness the
# whole way round; its floor stays sharp, so nothing sinks into a blend. Stated in the object's own frame, so it
# follows the object round whichever quarter turn the packer gives it. An axis
# the subbin states is one `max_size` may not state again -- both are the same
# measurement -- and `max_size` alone still bounds an object with no insert.
[[objects]]
name = "AAA batteries"
size =   ["4.5 cm", "124 mm"]
subbin = ["4.5cm", "", "3cm"]

[[objects]]
name = "tape measure"
size = ["80 mm", "85 mm"]

[[objects]]
name = "swiss army knife"
size = ["114 mm", "32 mm"]

[[objects]]
name = "steel file set"
size = ["380 mm", "100 mm"]

# [[objects]]
# name = "tape roll"
# size = ["152 mm", "110 mm"]

# [[objects]]
# name = "game boy color"
# size = ["80 mm", "135 mm"]

[[objects]]
name = "ethernet cable"
size = ["43 mm", "130 mm"]

